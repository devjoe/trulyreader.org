<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Truly</title>
    <meta
      name="description"
      content="Truly is a local-first reading assistant for social feeds and web pages."
    >
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f8fb;
        --card: #ffffff;
        --text: #111827;
        --muted: #5f6673;
        --border: #d9dee7;
        --accent: #2f7df6;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111418;
          --card: #1b1f24;
          --text: #eef2f7;
          --muted: #a8b0bd;
          --border: #343a43;
          --accent: #5aa0ff;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        line-height: 1.6;
      }

      main {
        width: min(720px, calc(100% - 32px));
        padding: 40px;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: var(--card);
        box-shadow: 0 20px 60px rgb(15 23 42 / 0.08);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
        font-size: 36px;
        font-weight: 800;
        letter-spacing: 0;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: 0 0 14px rgb(47 125 246 / 0.6);
      }

      p {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 18px;
      }

      a {
        color: var(--accent);
        font-weight: 700;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand" aria-label="Truly">
        <span>truly</span>
        <span class="dot" aria-hidden="true"></span>
      </div>
      <p>
        Truly is a local-first reading assistant for social feeds and web pages.
      </p>
      <p>
        Read the <a href="/privacy/">privacy policy</a> or share
        <a href="/feedback/">early preview feedback</a>.
      </p>
    </main>
  </body>
</html>
